<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/layout}">
	<head>
		<link rel="stylesheet" th:href = @{/item-list.css}/>
		<title>대문</title>
	</head>
	<body>
	<div layout:fragment="Content" class="content-fragment" >
		<p class="title" th:text = "|제목 : ${post.title}|"></p>	
		
		<p style="display: flex; gap: 30px; padding: 0 10px; justify-content: right;">
		<span th:text = "|작성자 : ${post.user.username}|"></span>
		<span th:text = "|작성 시각 : ${#temporals.format(post.cratedAt, 'yyyy-MM-dd HH:mm')}|"></span>
		</p>	
		<p th:text = "'내용'"></p>
		<br/>
		<p th:text = "|${post.content}|" style="word-break: break-all; white-space: pre-wrap;"></p>
		<br/>
		<form th:action="@{|/comment/create?postId=${post.id}|}" method="post" th:object = ${comment}>
			<p>
			<label for="content" th:text = "'내용'"></label>
			<input type="text" th:field="*{content}"> 
			</p>
			<p>
			<input type="submit"> 
			</p>
		</form>	

	</div>
	</body>
	
</html>
