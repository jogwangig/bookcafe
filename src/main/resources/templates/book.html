<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/layout}">
	<head>
		<link rel="stylesheet" th:href = @{/css/book.css}/>

		<title>대문</title>
	</head>
	<body>
	<div layout:fragment="Content" class="content-fragment">
		<p class="ud-link">
			<a th:href="@{|/book/modify?bookId=${book.id}|}" th:text = "|수정하기|"></a>
		</p>
		
		<img th:if="${coverImg}" th:src="|data:jpg;base64,${coverImg}|" width="250px" height="auto" />
		<p th:text = "|📖 ${book.bookInfo.title}|"></p>
		<p th:text = "|ISBN ${book.bookInfo.ISBN}|"></p>
		<a th:text = "'독서 기록 보기'" th:href="@{|/reading-record?bookId=${book.id}|}"></a>
		
	</div>
	</body>
	
</html>
