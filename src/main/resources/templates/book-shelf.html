<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/layout}">
	<head>
		<link rel="stylesheet" th:href = @{/item-list.css}/>
		<title>대문</title>
	</head>
	<body>
	<div layout:fragment="Content" class="content-fragment">
		<p class="title" >책장</p>

		<p th:text = "|📚 책장 ${bookShelf.name}|" ></p>
		
		<ul class="item-list">
			<li class="item" th:each = "book : ${books}">
				<a th:href="@{|/book?bookId=${book.id}|}" th:text = "|📖 ${book.bookInfo.title}|"></a>
			</li>
		</ul>
		
	</div>
	</body>
	
</html>
