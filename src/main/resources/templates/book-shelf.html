<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/layout}">
	<head>
		<link rel="stylesheet" th:href = @{/css/book-shelf.css}/>
		<title>책장</title>
	</head>
	<body>
	<div layout:fragment="Content" class="content-fragment">
		<p class="ud-link">
			<a th:href="@{|/book-shelf/modify?bookShelfId=${bookShelfWithBooks.id}|}" th:text = "|수정하기|"></a>
		</p>
		
		<p class="title" th:text = "|📚 책장 : ${bookShelfWithBooks.name}|">책장</p>
		
		<ul class="book-list">
			<li class="book" th:each = "book : ${bookShelfWithBooks.books}">
				<a class="book-link" th:href="@{|/book?bookId=${book.id}|}" th:text = "|📖 ${book.title}|"></a>
			</li>
		</ul>
		
	</div>
	</body>
	
</html>
