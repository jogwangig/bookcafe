<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/form-alone-layout}">
		
	<head>
		<title>사용자 계정 생성</title>
	</head>
	
	<body>
		<div layout:fragment="Content" class="content-fragment">
		<p class="form-title">게시글 등록!!</p>
		<form th:action="@{|/post/create?boardId=${boardId}|}" method="post" th:object = ${post}>
			
			<p sec:authorize="isAnonymous()">
				<label for="annonymousUsername" th:text = "'id'"></label>
				<input type="text" th:field="*{anonymousUsername}"> 
			</p>
				
			<p sec:authorize="isAnonymous()">
				<label for="annonymousUserPwd" th:text = "'비밀 번호'"></label>
				<input type="password" th:field="*{anonymousUserPwd}"> 
			</p>
			
			<p>
				<label for="title" th:text = "'제목'"></label>
				<input type="text" th:field="*{title}"> 
			</p>
			
			<p>
			<label for="content" th:text = "'내용'"></label>
			<textarea th:field="*{content}"/> 
			</p>

			<p>
			<input type="submit"> 
			</p>
		</form>
		</div>
	</body>
</html>
