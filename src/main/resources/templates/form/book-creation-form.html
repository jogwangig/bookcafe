<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/form-alone-layout}">
	<head>
		<title>사용자 계정 생성</title>
	</head>
	<body>
		<div layout:fragment="Content" class="content-fragment">
		<p class="form-title">책 등록!!</p>
		<!--
		<form th:action="@{/book/create}" method="post" th:object = ${bookInfo} enctype="multipart/form-data">
			-->
			
		<form th:action="${(currentURI != null and currentURI.matches('/book/modify.*'))}
				? @{/book/modify(bookId=${bookId})} 
				: @{/book/create}"  method="post" th:object="${book}" enctype="multipart/form-data">
				
				
			<p>
			<label for="title" th:text = "'title'"></label>
			<input type="text" th:field="*{title}"> 
			</p>
			
			<p>
			<label for="ISBN" th:text = "'ISBN'"></label>
			<input type="text" th:field= "*{isbn}"> 
			</p>
			
			<p>
			<input type="file" th:field= "*{coverImg}" accept="image/*"> 
			</p>
			
			<p>
			    <label for="bookshelf-select">등록 할 책장 :</label>
			    <select id="bookshelf-select" th:field= "*{bookShelfId}">
			      <option th:each = "b : ${bookShelves}" th:value="${b.id}" th:text="${b.name}">option</option>
			    </select>
			 </p>
			<p>
			<input type="submit"> 
			</p>
		</form>
		</div>
	</body>
</html>
