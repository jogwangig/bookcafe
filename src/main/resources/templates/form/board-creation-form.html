<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/form-layout}">
	<head>
		<link rel="stylesheet" th:href = @{/creation-form.css}/>
		<title>게시판 생성</title>
	</head>
	<body>
		<div layout:fragment="Content">
		<p>게시판 등록!!</p>
		<form th:action="@{/board/create}" method="post" th:object = ${board}>
			<p>
			<label for="name" th:text = "'board name'"></label>
			<input type="text" th:field="*{name}"> 
			</p>
			<p>
			<input type="submit"> 
			</p>
		</form>
		</div>
	</body>
</html>
