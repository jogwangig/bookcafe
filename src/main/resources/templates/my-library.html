<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/library-layout}">
	<head>
		<title>대문</title>
	</head>
	<body>
	<div layout:fragment="Content" class="content-fragment">
		<p class="list-title" >나의 도서관</p>
		<div th:each = "bookShelf : ${bookShelfDTOs}">
				
			<p class="list-sub-title" th:text = "|책장 이름 : ${bookShelf.name}|"></p>
					
			<ul class="item-list">
				<li class="item" th:each = "book : ${bookShelf.books}" th:text = "${book.bookInfo.title}"></li>
			</ul>
			
		</div>
	</div>
	</body>
	
</html>
