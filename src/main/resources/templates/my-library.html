<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/layout}">
	<head>
		<link rel="stylesheet" th:href = @{/my-library.css}/>
		<title>대문</title>
	</head>
	<body>
	<div layout:fragment="Content" class="bookshelf-list">
		<p>나의 도서관</p>
		<div th:each = "bookShelf : ${bookShelfDTOs}">
				
			<p th:text = "|책장 이름 : ${bookShelf.name}|"></p>
					
			<ul>
				<li th:each = "book : ${bookShelf.books}" th:text = "${book.bookInfo.title}"></li>
			</ul>
			
		</div>
	</div>
	</body>
	
</html>
