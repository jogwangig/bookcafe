<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/form-alone-layout}">
		
	<head>
		<script th:src="@{/js/book-search.js}" defer></script>
		<title>책 검색</title>
		<style>
			#search-btn{
				width: 80px;
			}
			
			.content-fragment{
				display: flex;
				flex-wrap: wrap;
				flex-direction: row;
			}
			
			.book-container{
				width: 300px;
				height: 350px;
			}
			
			p{
				margin-top : auto;
				overflow: clip;
			}
			
			#bookshelf-select-container{
				width: 400px;
				height: 300px;
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%,-50%);
				display: none;
				z-index: 1000;
			}
			#black-box{
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				z-index: 100;
				background-color: black;
				opacity: 0.5;
				display: none;
			}
			
		</style>
	</head>
	
	<body>
		<div layout:fragment="Content" class="content-fragment">
			<div class="search-container">
			<p>
				<label for="title" th:text = "'제목'"></label>
				<input type="text" name="title" id="title"> 
			</p>
			
			<p>
				<label for="author" th:text = "'저자'"></label>
				<input type="text" name="author" id="author"> 
			</p>
			
			<p>
				<label for="isbn" th:text = "'ISBN'"></label>
				<input type="text" name="isbn" id="isbn"> 
			</p>
			
			<button id="search-btn">검색</button>
			</div>
			
			<div class="black-box" id="black-box">aaa</div>
			
			<div id="bookshelf-select-container">
			    <label for="bookshelf-select">등록 할 책장 :</label>
			    <select id="bookshelf-select" name="bookshelf-select">
			      <option th:each = "b : ${bookShelves}" th:value="${b.id}" th:text="${b.name}">option</option>
			    </select>
				<button id="register-btn">검색</button>
			</div>			
		</div>
		
		
	</body>
</html>
