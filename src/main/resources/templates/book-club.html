<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
		layout:decorate="~{/layout/layout}">
		
	<head>
		<script th:src="@{/js/book-club.js}" defer></script>
		<title>독서 모임 목록</title>
	</head>
	<body>
		<div layout:fragment="Content" class="content-fragment">
		<ul>
			<li class="book-club-container" th:each = "bookClub : ${bookClubs}">
				<a class="item-link" th:href="@{|/book-club?bookClubId=${bookClub.id}|}" th:text = "|${bookClub.name}|"></a>
				<button class="register-btn" th:text = "|등록|"></button>
			</li>
		</ul>
		</div>
	</body>
	
</html>
